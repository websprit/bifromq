# =============================================================================
# GitHub Actions: Cross-Platform Docker Build for BifroMQ
# =============================================================================
#
# This workflow builds a linux/amd64 Docker image on GitHub-hosted runners.
# Key advantages over local macOS build:
#   - Native linux/amd64 execution (no QEMU emulation for C++ compilation)
#   - RocksDB C++ compile: ~5-10 min vs 30+ min on macOS ARM64
#   - Automatic Docker layer caching via GitHub Actions Cache (gha)
#   - Pushes to ghcr.io (GitHub Container Registry) automatically
#
# Triggers:
#   - Push to main/feature branches: build only (no push by default)
#   - Tag push (v*): build + push to ghcr.io
#   - PR to main: build only (no push, cache populated)
#   - Manual workflow_dispatch: optional override tag + push toggle
#
# Usage in K8s:
#   image: ghcr.io/<owner>/bifromq:<tag>
# =============================================================================

name: Docker Build

on:
  push:
    branches: [main, feature/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (leave empty for auto)'
        required: false
        default: ''
      push:
        description: 'Push image to registry'
        required: false
        default: 'false'
      maven_opts:
        description: 'Extra Maven options (e.g. -Pbuild-release)'
        required: false
        default: '-Pbuild-release'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout source
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ensure full history for tags/branches metadata
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Prepare empty m2-cache so Dockerfile COPY succeeds
      # -----------------------------------------------------------------------
      - name: Prepare Maven cache mountpoint
        run: mkdir -p m2-cache

      # -----------------------------------------------------------------------
      # 3. Set up Docker Buildx with GitHub Actions cache backend
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Enable BuildKit inline cache for faster layer reuse
          buildkitd-flags: --debug

      # -----------------------------------------------------------------------
      # 4. Login to GitHub Container Registry (ghcr.io)
      #    Only when we are going to push (tag push or manual toggle)
      # -----------------------------------------------------------------------
      - name: Login to GHCR
        if: >
          github.event_name != 'pull_request' &&
          (github.ref_type == 'tag' || inputs.push == 'true')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 5. Extract Docker metadata (tags, labels)
      # -----------------------------------------------------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # -----------------------------------------------------------------------
      # 6. Build (and push if applicable)
      #    Platform locked to linux/amd64 for k8s deployment.
      #    Cache from/to GitHub Actions cache backend (gha) for fast rebuilds.
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.build
          platforms: linux/amd64
          push: >
            ${{ github.event_name != 'pull_request' &&
                (github.ref_type == 'tag' || inputs.push == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MAVEN_OPTS=${{ inputs.maven_opts || '-Pbuild-release' }}

      # -----------------------------------------------------------------------
      # 7. Generate artifact attestation (provenance)
      #    Only when image was actually pushed.
      # -----------------------------------------------------------------------
      - name: Generate artifact attestation
        if: >
          github.event_name != 'pull_request' &&
          (github.ref_type == 'tag' || inputs.push == 'true')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
