apiVersion: batch/v1
kind: Job
metadata:
  name: mqtt-load-test
spec:
  completionMode: Indexed
  parallelism: 20
  completions: 20
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load-test
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - "pip install paho-mqtt -q && python3 /scripts/load_test.py"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: mqtt-load-test-script
