apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bifromq.fullname" . }}-config
  labels:
    {{- include "bifromq.labels" . | nindent 4 }}
data:
  standalone.yml: |
    {{- if .Values.plugin.authProviderFQN }}
    authProviderFQN: {{ .Values.plugin.authProviderFQN | quote }}
    {{- end }}
    {{- if .Values.plugin.resourceThrottlerFQN }}
    resourceThrottlerFQN: {{ .Values.plugin.resourceThrottlerFQN | quote }}
    {{- end }}
    {{- if .Values.plugin.settingProviderFQN }}
    settingProviderFQN: {{ .Values.plugin.settingProviderFQN | quote }}
    {{- end }}

    mqttServiceConfig:
      server:
        {{- if .Values.mqtt.tcpListeners }}
        tcpListeners:
          {{- range $listenerId, $listener := .Values.mqtt.tcpListeners }}
          {{ $listenerId }}:
            enable: {{ default true $listener.enable }}
            {{- with $listener.host }}
            host: {{ . | quote }}
            {{- end }}
            port: {{ required (printf "mqtt.tcpListeners.%s.port is required" $listenerId) $listener.port }}
            {{- with $listener.authProviderFQN }}
            authProviderFQN: {{ . | quote }}
            {{- end }}
          {{- end }}
        {{- else }}
        tcpListener:
          port: {{ .Values.mqtt.tcpPort }}
        {{- end }}
        {{- if .Values.mqtt.tlsListeners }}
        tlsListeners:
          {{- range $listenerId, $listener := .Values.mqtt.tlsListeners }}
          {{ $listenerId }}:
            enable: {{ default true $listener.enable }}
            {{- with $listener.host }}
            host: {{ . | quote }}
            {{- end }}
            port: {{ required (printf "mqtt.tlsListeners.%s.port is required" $listenerId) $listener.port }}
            {{- with $listener.authProviderFQN }}
            authProviderFQN: {{ . | quote }}
            {{- end }}
            {{- if $listener.sslConfig }}
            sslConfig:
              {{- toYaml $listener.sslConfig | nindent 14 }}
            {{- else if $.Values.tls.certSecretName }}
            sslConfig:
              certFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.certFile }}"
              keyFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.keyFile }}"
              trustCertsFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.trustCertsFile }}"
              clientAuth: {{ $.Values.tls.clientAuth }}
            {{- end }}
          {{- end }}
        {{- else }}
        {{- if .Values.mqtt.tlsEnabled }}
        tlsListener:
          enable: true
          port: {{ .Values.mqtt.tlsPort }}
          {{- if .Values.tls.certSecretName }}
          sslConfig:
            certFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.certFile }}"
            keyFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.keyFile }}"
            trustCertsFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.trustCertsFile }}"
            clientAuth: {{ .Values.tls.clientAuth }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.mqtt.wsListeners }}
        wsListeners:
          {{- range $listenerId, $listener := .Values.mqtt.wsListeners }}
          {{ $listenerId }}:
            enable: {{ default true $listener.enable }}
            {{- with $listener.host }}
            host: {{ . | quote }}
            {{- end }}
            port: {{ required (printf "mqtt.wsListeners.%s.port is required" $listenerId) $listener.port }}
            wsPath: {{ default $.Values.mqtt.wsPath $listener.wsPath | quote }}
            {{- with $listener.authProviderFQN }}
            authProviderFQN: {{ . | quote }}
            {{- end }}
          {{- end }}
        {{- else }}
        {{- if .Values.mqtt.wsEnabled }}
        wsListener:
          enable: true
          port: {{ .Values.mqtt.wsPort }}
          wsPath: {{ .Values.mqtt.wsPath | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.mqtt.wssListeners }}
        wssListeners:
          {{- range $listenerId, $listener := .Values.mqtt.wssListeners }}
          {{ $listenerId }}:
            enable: {{ default true $listener.enable }}
            {{- with $listener.host }}
            host: {{ . | quote }}
            {{- end }}
            port: {{ required (printf "mqtt.wssListeners.%s.port is required" $listenerId) $listener.port }}
            wsPath: {{ default $.Values.mqtt.wssPath $listener.wsPath | quote }}
            {{- with $listener.authProviderFQN }}
            authProviderFQN: {{ . | quote }}
            {{- end }}
            {{- if $listener.sslConfig }}
            sslConfig:
              {{- toYaml $listener.sslConfig | nindent 14 }}
            {{- else if $.Values.tls.certSecretName }}
            sslConfig:
              certFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.certFile }}"
              keyFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.keyFile }}"
              trustCertsFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.trustCertsFile }}"
              clientAuth: {{ $.Values.tls.clientAuth }}
            {{- end }}
          {{- end }}
        {{- else }}
        {{- if .Values.mqtt.wssEnabled }}
        wssListener:
          enable: true
          port: {{ .Values.mqtt.wssPort }}
          wsPath: {{ .Values.mqtt.wssPath | quote }}
          {{- if .Values.tls.certSecretName }}
          sslConfig:
            certFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.certFile }}"
            keyFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.keyFile }}"
            trustCertsFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.trustCertsFile }}"
            clientAuth: {{ .Values.tls.clientAuth }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.mqtt.quicListeners }}
        quicListeners:
          {{- range $listenerId, $listener := .Values.mqtt.quicListeners }}
          {{ $listenerId }}:
            enable: {{ default true $listener.enable }}
            {{- with $listener.host }}
            host: {{ . | quote }}
            {{- end }}
            port: {{ required (printf "mqtt.quicListeners.%s.port is required" $listenerId) $listener.port }}
            {{- with $listener.authProviderFQN }}
            authProviderFQN: {{ . | quote }}
            {{- end }}
            {{- if $listener.sslConfig }}
            sslConfig:
              {{- toYaml $listener.sslConfig | nindent 14 }}
            {{- else if $.Values.tls.certSecretName }}
            sslConfig:
              certFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.certFile }}"
              keyFile: "{{ $.Values.tls.mountPath }}/{{ $.Values.tls.keyFile }}"
              clientAuth: {{ $.Values.tls.clientAuth }}
            {{- end }}
          {{- end }}
        {{- else }}
        {{- if .Values.mqtt.quicEnabled }}
        quicListener:
          enable: true
          port: {{ .Values.mqtt.quicPort }}
          {{- if .Values.tls.certSecretName }}
          sslConfig:
            certFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.certFile }}"
            keyFile: "{{ .Values.tls.mountPath }}/{{ .Values.tls.keyFile }}"
            clientAuth: {{ .Values.tls.clientAuth }}
          {{- end }}
        {{- end }}
        {{- end }}

    {{- if .Values.apiServer.enabled }}
    apiServerConfig:
      enable: true
      httpPort: {{ .Values.apiServer.port }}
    {{- end }}

    clusterConfig:
      env: {{ .Values.clusterConfig.env | quote }}
      port: {{ .Values.clusterConfig.port }}
      clusterDomainName: {{ include "bifromq.headlessServiceFQDN" . | quote }}

    distServiceConfig:
      worker:
        walEngineConfig:
          groupCommit: {{ .Values.engineConfig.groupCommit }}

    inboxServiceConfig:
      store:
        walEngineConfig:
          groupCommit: {{ .Values.engineConfig.groupCommit }}

    retainServiceConfig:
      store:
        walEngineConfig:
          groupCommit: {{ .Values.engineConfig.groupCommit }}
